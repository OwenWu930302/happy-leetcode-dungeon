<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="game-token" content="__GAME_TOKEN__">
<title>開心每日刷題 · 演算法地城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e9ab47'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%232a1704' font-weight='900'%3E%E5%88%B7%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="flash" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="hud">
  <div class="hud-mascot" id="mascotBox"></div>
  <div class="hud-main">
    <div class="hud-top">
      <span class="lvl">LV <b id="hLv">1</b></span>
      <span class="title" id="hTitle">見習獵題人</span>
      <span class="power" title="戰力（類 Elo）">戰力 <b id="hPow">1000</b><i id="hRank">青銅</i></span>
      <span class="shards" title="靈魂結晶：遠征結束後留下，用來買永久強化"><span class="gem"></span><b id="hShards">0</b></span>
    </div>
    <div class="xpbar"><i id="hXp"></i><span id="hXpTxt">0 / 50</span></div>
    <div class="bubble" id="bubble" aria-live="polite"><b>露緹</b><span id="say">歡迎回來，獵題人。</span></div>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="home" aria-selected="true"><span>酒館</span></button>
  <button role="tab" data-tab="run"><span>遠征</span></button>
  <button role="tab" data-tab="tree"><span>技能樹</span></button>
  <button role="tab" data-tab="power"><span>戰力</span></button>
  <button role="tab" data-tab="problem"><span>題目</span></button>
</nav>

<main>
  <section id="tab-home" class="tab"></section>
  <section id="tab-run" class="tab" hidden></section>
  <section id="tab-tree" class="tab" hidden></section>
  <section id="tab-power" class="tab" hidden></section>
  <section id="tab-problem" class="tab" hidden></section>
</main>

<div id="dock" hidden></div>
<div id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<aside id="ad" hidden></aside>
<div id="toasts" aria-live="polite"></div>
<div id="busy" hidden><div class="busy-card"><div class="spinner"></div><div id="busyTxt">判題中…</div></div></div>

<script src="app.js"></script>
</body>
</html>
